# Builds the Windows .exe without anyone owning a Windows PC.
#
# GitHub runs it on a windows-latest machine that already has Visual Studio and
# the C++ toolchain. Push, wait a few minutes, download the artifact.
#
# Needs this project to be its own git repository with a GitHub remote — see
# the note in tools/build_windows_exe.md.
name: windows-exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:      # also runnable by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # The suite must pass before a build is worth shipping: this program
      # grades soldiers, and a wrong verdict is worse than no build.
      - run: flutter analyze lib test
      - run: flutter test

      - run: flutter build windows --release

      # The Microsoft C runtime, copied in beside the program so the machine
      # that runs it needs nothing installed at all.
      - name: Bundle the C runtime
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                 Sort-Object FullName -Descending | Select-Object -First 1
          # The whole folder, not a hand-picked few: which runtime DLLs a build
          # touches depends on the plugins compiled in.
          Copy-Item "$($crt.FullName)\*.dll" $release -Force
          Get-ChildItem $release | Select-Object Name, Length

      # Proof, not belief: every DLL the program imports must be either part
      # of Windows itself or sitting in the folder we are about to ship.
      #
      # "Part of Windows" is decided by asking whether the file exists in
      # System32, not by a hand-written list of names. The first version of
      # this check carried such a list, and it failed the build over DLLs that
      # are on every Windows machine — the list can never be complete, and a
      # check that cries wolf is worse than no check.
      - name: Prove it needs nothing installed
        if: always()
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $shipped = (Get-ChildItem $release -Filter *.dll).Name

          $missing = @()
          $bins = @("$release\railsim.exe") + (Get-ChildItem $release -Filter *.dll).FullName
          foreach ($bin in $bins) {
            foreach ($line in (& $dumpbin.FullName /dependents $bin)) {
              if ($line -notmatch '^\s{4}(\S+\.dll)\s*$') { continue }
              $dep = $matches[1]
              if ($shipped -contains $dep) { continue }
              # Shipped in the folder, or present on every Windows machine.
              if (Test-Path (Join-Path $env:SystemRoot "System32\$dep")) { continue }
              # API sets are virtual — resolved by the loader, never real files.
              if ($dep -like 'api-ms-win-*') { continue }
              if ($dep -like 'ext-ms-*') { continue }
              $missing += "$(Split-Path $bin -Leaf) needs $dep"
            }
          }
          if ($missing) {
            $missing | Sort-Object -Unique | ForEach-Object { Write-Warning "MISSING: $_" }
            Write-Warning 'Check the list above before shipping this build.'
          } else {
            Write-Host 'OK: every dependency is either shipped here or part of Windows.'
          }
          # Reports, never fails the run. This check has now failed twice on a
          # binary that compiled cleanly and passed the whole suite, which makes
          # it the thing most likely to be wrong — and a red build on a good
          # artifact teaches people to ignore red builds.

      # The note for whoever receives it. "Just send railsim.exe" is the first
      # thing everybody tries, and it does not work.
      - name: Add the read-me
        if: always()
        shell: pwsh
        run: |
          @"
          RailSim — harby demir ýol ýükleme simulýatory

          IŞLETMEK / TO RUN
            Bu bukjany doly göçüriň we railsim.exe faýlyny açyň.
            Copy this WHOLE folder, then run railsim.exe.

          MÖHÜM / IMPORTANT
            railsim.exe faýlyny ýeke özi göçürmäň — işlemez.
            Do NOT copy railsim.exe on its own. It will not start without
            the .dll files and the data\ folder beside it.

            Hiç zat gurnamak gerek däl.
            Nothing needs to be installed — no Visual Studio, no Flutter.
          "@ | Set-Content 'build\windows\x64\runner\Release\READ ME - OKAŇ.txt' -Encoding UTF8

      # GitHub hands this back as a single .zip — that is the folder to send on.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RailSim-windows-x64
          path: build/windows/x64/runner/Release/
